<header class="main-header">
  <div class="container">
    <a href="/">
      <head>
        <link
          href="//www.samsung.com/etc.clientlibs/samsung/clientlibs/consumer/global/clientlib-common/resources/images/global-samsung-logo.svg"
          as="image"
          rel="preload"
          type="image/svg+xml"
        />
      </head>
      <img
        fetchpriority="high"
        src="https://www.samsung.com/etc.clientlibs/samsung/clientlibs/consumer/global/clientlib-common/resources/images/global-samsung-logo.svg"
        alt="logo samsung"
        height="105"
        width="85"
      />
    </a>
    <div class="checkout-steps">
      <div class="checkout-steps-wrap">
        <span class="checkout-steps_bar">
          <span class="checkout-steps_bar_inner"></span>
          <span class="checkout-steps_bar_inner-active"></span>
        </span>
        <div class="checkout-steps_items">
          <span
            class="checkout-steps_item checkout-steps_item_identification js-checkout-steps-item v-custom-step-profile"
            data-url="/checkout/#/profile"
          >
            <span class="text" data-before="1">Dados Pessoais</span>
          </span>
          <span
            class="checkout-steps_item checkout-steps_item_shipping js-checkout-steps-item v-custom-step-shipping"
            data-url="/checkout/#/shipping"
          >
            <span class="text" data-before="2">Entrega</span>
          </span>
          <span
            class="checkout-steps_item checkout-steps_item_payment js-checkout-steps-item v-custom-step-payment"
            data-url="/checkout/#/payment"
          >
            <span class="text" data-before="3">Pagamentos</span>
          </span>
        </div>
      </div>
    </div>
    <span class="checkout-secure-buy"> Compra 100% segura. </span>
  </div>
</header>
